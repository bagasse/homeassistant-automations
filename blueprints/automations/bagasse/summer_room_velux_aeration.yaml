# More info about automations/blueprints:
# - https://www.home-assistant.io/docs/automation/basics/
# - https://www.home-assistant.io/docs/blueprint/
blueprint:
  name: Summer Room Velux Aeration
  description: >
    When house mode (`input_select.house_mode`) is `summer`, open the room's Velux
    window (and optionally shutter) when the room is warmer than outdoors, and
    close them again when the room temperature starts rising.

    Picks the `window` and `shutter` cover in the selected area, ignoring Overkiz
    `*_low_speed` siblings.
  domain: automation
  author: Baptiste Agasse <baptiste.agasse@gmail.com>
  source_url: https://github.com/bagasse/homeassistant-automations/blob/main/blueprints/automations/bagasse/summer_room_velux_aeration.yaml
  homeassistant:
    min_version: "2026.7.0" # Introduce temperature.crossed_threshold trigger
  input:
    room:
      name: Room
      description: >
        Area that contains the room temperature sensor, Velux window cover,
        and optional shutter cover.
      selector:
        area:
    outdoor_temperature:
      name: Outdoor temperature
      description: Outdoor temperature sensor used as the aeration threshold.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    positions:
      name: Positions
      icon: mdi:arrow-up-down
      input:
        window_position:
          name: Window position
          description: Target open position for the Velux window (100% = fully open).
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
    shutter_settings:
      name: Shutters
      icon: mdi:window-shutter
      collapsed: true
      input:
        manage_shutter:
          name: Manage shutters
          description: >
            When enabled, open the shutter before the window, and close the
            shutter after the window.
          default: true
          selector:
            boolean:
        shutter_position:
          name: Shutter position
          description: Target open position for the shutter when managed (100% = fully open).
          default: 100
          selector:
            number:
              min: 0
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        action_delay:
          name: Delay between shutter and window
          description: >
            Seconds to wait between shutter and window moves so hardware can
            finish traveling.
          default: 10
          selector:
            number:
              min: 0
              max: 300
              step: 1
              unit_of_measurement: seconds
              mode: slider

# Finish the current open/close sequence before starting the next one.
mode: queued
max: 5
max_exceeded: silent

trigger_variables:
  room: !input room

variables:
  window_position: !input window_position
  manage_shutter: !input manage_shutter
   # Use low speed siblings as it makes less noise
  window_cover: >
    {{ expand(area_entities(room))
       | selectattr('domain', 'eq', 'cover')
       | selectattr('attributes.device_class', 'eq', 'window')
       | selectattr('entity_id', 'search', '_low_speed$')"
       | map(attribute='entity_id')
       | first
       | default(none, true) }}
  # Use low speed siblings as it makes less noise
  shutter_cover: >
    {{ expand(area_entities(room))
       | selectattr('domain', 'eq', 'cover')
       | selectattr('attributes.device_class', 'eq', 'shutter')
       | selectattr('entity_id', 'search', '_low_speed$')
       | map(attribute='entity_id')
       | first
       | default(none, true) }}

triggers:
  - trigger: temperature.crossed_threshold
    id: open
    target:
      area_id: !input room
    options:
      threshold:
        type: above
        value:
          entity: !input outdoor_temperature
  - trigger: temperature.changed
    id: open
    target:
      entity_id: !input outdoor_temperature
    options:
      threshold:
        type: any
  - trigger: temperature.changed
    id: close
    target:
      area_id: !input room
    options:
      threshold:
        type: any

conditions:
  - alias: House mode is summer
    condition: state
    entity_id: input_select.house_mode
    state: summer

actions:
  - alias: Stop if the room has no Velux window
    if:
      - "{{ window_cover is none }}"
    then:
      - stop: "No window cover found in the selected room"

  - choose:
      - alias: Open shutter then window when the room is warmer than outdoors
        conditions:
          - condition: trigger
            id: open
          - condition: temperature.is_value
            target:
              area_id: !input room
            options:
              threshold:
                type: above
                value:
                  entity: !input outdoor_temperature
              behavior: any
          - "{{ state_attr(window_cover, 'current_position') | float(0) < window_position }}"
        sequence:
          - alias: Open shutter first when managed
            if:
              - "{{ manage_shutter and shutter_cover is not none }}"
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: "{{ shutter_cover }}"
                data:
                  position: !input shutter_position
              - delay:
                  seconds: !input action_delay
          - alias: Open Velux window
            action: cover.set_cover_position
            target:
              entity_id: "{{ window_cover }}"
            data:
              position: !input window_position

      - alias: Close window then shutter when room temperature is increasing
        conditions:
          - condition: trigger
            id: close
          - "{{ trigger.to_state.state | float(0) > trigger.from_state.state | float(0) }}"
          - "{{ state_attr(window_cover, 'current_position') | float(0) > 0 }}"
        sequence:
          - alias: Close Velux window
            action: cover.close_cover
            target:
              entity_id: "{{ window_cover }}"
          - alias: Close shutter after window when managed
            if:
              - "{{ manage_shutter and shutter_cover is not none }}"
            then:
              - delay:
                  seconds: !input action_delay
              - action: cover.close_cover
                target:
                  entity_id: "{{ shutter_cover }}"
